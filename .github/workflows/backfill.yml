name: Backfill Thumbnails

# Re-tries setting custom thumbnails on every video still carrying a
# THUMBNAIL_MANUAL_NEEDED marker. Runs automatically every day at 08:30 UTC
# (just after midnight Pacific, when Composio's SHARED YouTube API quota
# resets at 08:00 UTC) AND on manual/API dispatch. Use case: the publish run's
# Composio thumbnail call failed because that shared quota was exhausted; this
# catches it the next morning. It no-ops quickly when there are no markers, so
# leaving it scheduled is cheap. Once you set YOUTUBE_REFRESH_TOKEN (your own
# OAuth) the publish run sets thumbnails directly and this becomes redundant —
# you can then delete the schedule.

on:
  schedule:
    # 08:30 UTC daily = ~30 min after midnight PT quota reset
    - cron: "30 8 * * *"
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Backfill thumbnails (set on all videos flagged MANUAL_NEEDED)
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_ENTITY_ID: ${{ secrets.COMPOSIO_ENTITY_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/backfill_thumbnails.py

      - name: Commit removed markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # output/ is gitignored — only touch the marker files (same targeted
          # approach as the publish workflow's commit step).
          git add -A -- output/*/THUMBNAIL_MANUAL_NEEDED.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: thumbnails backfilled [skip ci]"
            git push
            echo "pushed marker removals"
          else
            echo "no marker changes to commit"
          fi
