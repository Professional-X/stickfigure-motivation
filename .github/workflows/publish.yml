name: Publish Stick Figure Motivation

on:
  schedule:
    # Mon / Wed / Fri at 09:00 UTC
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch: {}  # manual trigger from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # image gen + whisper + ffmpeg can take a while

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg + ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and publish video
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_ENTITY_ID: ${{ secrets.COMPOSIO_ENTITY_ID }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          VIDEO_OUTPUT_DIR: ./output
        run: python pipeline.py

      - name: Upload output as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
