name: Publish Stick Figure Motivation

on:
  schedule:
    # Mon / Wed / Fri at 09:00 UTC
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch: {}  # manual trigger from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # SVG render is instant; main cost is whisper + ffmpeg

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg + ffprobe + SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and publish video
        env:
          # === LLM (OpenRouter, free Nemotron Ultra 550B) ===
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # === Upload: Direct YouTube Data API (recommended) ===
          # Set these 3 to enable direct upload. See get_youtube_oauth.py for setup.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # === Upload: Composio fallback (flaky as of 2026) ===
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_ENTITY_ID: ${{ secrets.COMPOSIO_ENTITY_ID }}
          # === Optional: Cloudflare Workers AI (faster than Pollinations) ===
          # If both set, also set IMAGE_PROVIDER=cloudflare as a repo Variable
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # === Optional overrides (set as repo Variables, not Secrets) ===
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          VIDEO_OUTPUT_DIR: ./output
        run: python pipeline.py

      - name: Upload output as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload final.mp4 to GitHub Release (permanent storage for retry workflow)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the latest run dir
          RUN_DIR=$(ls -td output/*/ | head -1)
          if [ -z "$RUN_DIR" ] || [ ! -f "$RUN_DIR/final.mp4" ]; then
            echo "No final.mp4 found, skipping release upload"
            exit 0
          fi
          RUN_ID="${{ github.run_id }}"
          # Create a release with tag = run_id
          gh release create "video-${RUN_ID}" "$RUN_DIR/final.mp4" \
            --title "Video ${RUN_ID}" \
            --notes "Auto-generated video. Final.mp4 retained for retry_upload workflow." \
            --prerelease || \
          gh release upload "video-${RUN_ID}" "$RUN_DIR/final.mp4" --clobber

          # Get the download URL and write to metadata.json
          DOWNLOAD_URL=$(gh release view "video-${RUN_ID}" --json assets --jq '.assets[0].url')
          echo "{\"video_release_url\": \"${DOWNLOAD_URL}\", \"run_id\": \"${RUN_ID}\"}" > "$RUN_DIR/release_info.json"
          echo "Release URL: ${DOWNLOAD_URL}"

      - name: Commit metadata + release info for retry workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only commit lightweight files (not the mp4) — retry workflow
          # downloads mp4 from the GitHub Release on demand.
          git add output/*/metadata.json output/*/MANUAL_UPLOAD_NEEDED.txt output/*/release_info.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: video metadata for retry upload [skip ci]"
            git push
          else
            echo "No metadata changes to commit."
          fi
