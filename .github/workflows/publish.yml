name: Publish StickVerse Premium

on:
  schedule:
    # Mon + Wed + Fri at 17:00 UTC (3x/week, evenly distributed)
    # 17:00 UTC = 9am Pacific / 12pm Eastern / 5pm London
    - cron: "0 17 * * 1,3,5"
  workflow_dispatch: {}  # manual trigger from Actions tab (one-click publish)

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Mixkit download + 6-scene cinematic compose (~10-15 min)
    permissions:
      contents: write   # needed for gh release create + git push

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg + ffprobe + SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache whisper model + Incompetech music
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ./music
          key: premium-cache-${{ runner.os }}-v1

      - name: Ensure >= 2 unpublished topics in library (NVIDIA NIM generation)
        # Generates fresh 6-scene scripts via NVIDIA NIM (nemotron-3-ultra-550b)
        # so the queue always has NEW content to publish — no more looping back
        # to re-upload a duplicate curated topic. No-op if NVIDIA_API_KEY is
        # missing; the queue then falls back to curated TOPICS.
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python ensure_library.py

      - name: Commit generated topics to library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add premium/topics_library.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add LLM-generated topics to library [skip ci]"
            git push
            echo "pushed library update"
          else
            echo "no library changes to commit"
          fi

      - name: Generate and publish premium video
        env:
          # === LLM (OpenRouter, free Nemotron Ultra 550B) ===
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # === Upload: Direct YouTube Data API (recommended) ===
          # Set these 3 to enable direct upload. See get_youtube_oauth.py for setup.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # === Upload: Composio fallback (flaky as of 2026) ===
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_ENTITY_ID: ${{ secrets.COMPOSIO_ENTITY_ID }}
          # === Optional: Cloudflare Workers AI (faster than Pollinations) ===
          # If both set, also set IMAGE_PROVIDER=cloudflare as a repo Variable
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # === Optional overrides (set as repo Variables, not Secrets) ===
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          # Channel handle shown on thumbnails (set as repo Variable, not Secret)
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
          VIDEO_OUTPUT_DIR: ./output
        run: python pipeline_premium.py

      - name: Upload output as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit metadata + thumbnail + uploaded markers (for topic queue)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Force-add lightweight files (output/ is gitignored, but the topic
          # queue in premium/queue.py reads these to know which topics are
          # already published, so we track just these small files).
          # thumbnail.png (primary, ~1 MB) + thumbnails/thumbnail_{A,B,C}.png
          # (the 3 variants, ~1 MB each) are committed so you can manually
          # A/B-test them in YouTube Studio. final.mp4 is NOT committed (too
          # large); it lives in the run artifact for 7 days.
          # uploaded.txt MUST be committed on success so the next run skips this
          # topic and publishes the next one.
          git add -f \
            output/*/metadata.json \
            output/*/thumbnail.png \
            "output/*/thumbnails/thumbnail_*.png" \
            output/*/uploaded.txt \
            output/*/MANUAL_UPLOAD_NEEDED.txt \
            output/*/THUMBNAIL_MANUAL_NEEDED.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: video metadata + thumbnails + upload markers [skip ci]"
            git push
          else
            echo "No metadata changes to commit."
          fi

      - name: Set custom thumbnail on YouTube (via Composio)
        if: always()
        env:
          # Same authorized YouTube connection used for upload — no OAuth needed.
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_ENTITY_ID: ${{ secrets.COMPOSIO_ENTITY_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # thumbnail.png was just committed by the previous step, so its
          # raw.githubusercontent.com URL is public. This step hands that URL
          # to Composio's YOUTUBE_UPDATE_THUMBNAIL action, which sets it on the
          # just-uploaded video. It only runs if upload.py left a
          # THUMBNAIL_MANUAL_NEEDED marker (the direct-API OAuth path didn't
          # set it — usually because YOUTUBE_REFRESH_TOKEN isn't configured).
          # On failure (e.g. Composio's shared YouTube quota exhausted, or
          # channel not phone-verified) it updates THUMBNAIL_MANUAL_NEEDED.txt
          # with the exact reason.
          python set_thumbnail_composio.py

      - name: Thumbnail status (action required if skipped)
        if: always()
        run: |
          echo "==================== THUMBNAIL STATUS ===================="
          latest=$(ls -d output/*/ 2>/dev/null | tail -1)
          if [ -z "$latest" ]; then echo "no output dir"; exit 0; fi
          echo "run dir: $latest"
          if [ -f "${latest}THUMBNAIL_MANUAL_NEEDED.txt" ]; then
            echo "!! CUSTOM THUMBNAIL WAS NOT SET ON YOUTUBE !!"
            echo "    -> video is using YouTube's auto-generated thumbnail."
            cat "${latest}THUMBNAIL_MANUAL_NEEDED.txt"
          elif [ -f "${latest}uploaded.txt" ]; then
            echo "custom thumbnail SET on YouTube (variant B, via Composio)."
          else
            echo "upload did not complete; no thumbnail action needed yet."
          fi
          echo "=========================================================="
