name: Publish Stick Figure Motivation

on:
  schedule:
    # Mon / Wed / Fri at 09:00 UTC
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch: {}  # manual trigger from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Pollinations ~50s/image × 25 = ~21 min + whisper + ffmpeg

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg + ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and publish video
        env:
          # === LLM (OpenRouter, free Nemotron Ultra 550B) ===
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # === Upload: Direct YouTube Data API (recommended) ===
          # Set these 3 to enable direct upload. See get_youtube_oauth.py for setup.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # === Upload: Composio fallback (flaky as of 2026) ===
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_ENTITY_ID: ${{ secrets.COMPOSIO_ENTITY_ID }}
          # === Optional: Cloudflare Workers AI (faster than Pollinations) ===
          # If both set, also set IMAGE_PROVIDER=cloudflare as a repo Variable
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # === Optional overrides (set as repo Variables, not Secrets) ===
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          VIDEO_OUTPUT_DIR: ./output
        run: python pipeline.py

      - name: Upload output as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
